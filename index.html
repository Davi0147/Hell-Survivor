<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hell Survivor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b090a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 40px rgba(255, 60, 0, 0.15);
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="build-version" style="
    position: fixed;
    bottom: 8px;
    right: 12px;
    font-family: 'Silkscreen', monospace;
    font-size: 10px;
    color: rgba(243, 209, 122, 0.7);
    background: rgba(15, 3, 8, 0.75);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid rgba(197, 155, 39, 0.35);
    pointer-events: none;
    z-index: 99999;
    letter-spacing: 0.5px;
  ">Build v0.3.4 - Pixel Art Title Logo</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
