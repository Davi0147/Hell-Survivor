<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Hell Survivor</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#ff0055" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hell Survivor" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Pixelzone';
      src: url('/assets/fonts/Pixelzone.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      /* iPhone/Android: altura da área realmente visível (sem ficar atrás das barras do navegador) */
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background-color: #0b090a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      /* Trava a página: arrastar o dedo no jogo não rola a tela nem faz o Safari mostrar/esconder as barras */
      position: fixed;
      inset: 0;
    }
    #game-container {
      width: 100%;
      height: 100%;
      /* Notch e cantos arredondados: o jogo fica dentro da área segura; o fundo escuro preenche o resto */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 40px rgba(255, 60, 0, 0.15);
    }
  </style>
  <!-- Pré-carregador de fontes para garantir renderização perfeita antes do primeiro frame do canvas -->
  <div style="font-family: 'Pixelzone', monospace; position: absolute; left: -9999px; visibility: hidden;" aria-hidden="true">
    COMUM RARO ÉPICO MÍSTICO SUPREMO FOICE ADAGAS METEORO DANO VIDA VOCÊ RECEBE 0123456789 +%
  </div>
  <div style="font-family: 'Silkscreen', monospace; font-weight: bold; position: absolute; left: -9999px; visibility: hidden;" aria-hidden="true">
    JOGAR HISTÓRIA MODO INFINITO CONFIGURAÇÕES SAIR NIXY CHEFE 0123456789
  </div>
  <div style="font-family: 'Press Start 2P', monospace; position: absolute; left: -9999px; visibility: hidden;" aria-hidden="true">
    HELL SURVIVOR 0123456789
  </div>

  <div id="game-container"></div>
  <div id="build-version" style="
    position: fixed;
    bottom: 3px;
    right: 6px;
    font-family: 'Silkscreen', monospace;
    font-size: 7px;
    color: rgba(243, 209, 122, 0.45);
    background: rgba(15, 3, 8, 0.45);
    padding: 1px 4px;
    border-radius: 3px;
    border: 1px solid rgba(197, 155, 39, 0.2);
    pointer-events: none;
    z-index: 99999;
    letter-spacing: 0.5px;
  ">Carregando versão...</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
